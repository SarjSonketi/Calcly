const isqrt=n=>{if(n<2n)return n;let x=1n<<BigInt(n.toString(2).length/2+1);for(;;){const y=(x+n/x)/2n;if(y>=x)return x;x=y}};
const DSC=(s,n)=>s[0]+"."+s.slice(1,n+1);
const piDig=()=>{const S=10n**206n,ai=x=>{let t=S/x,s=t,x2=x*x,k=1n;while(t>0n){t=t/x2;s+=(k%2n?0n-1n:1n)*t/(2n*BigInt(k)+1n);k++}return s};return (16n*ai(5n)-4n*ai(239n)).toString()};
const eDig=()=>{const S=10n**206n;let t=S,s=S,k=1n;while(t>0n){t=t/BigInt(k);s+=t;k++}return s.toString()};
const phiDig=()=>{const D=10n**207n;return ((D+isqrt(5n*D*D))/2n).toString()};
const GM="5772156649015328606065120900824024310421593359399235988057672348848677267776646709369470632917467495146314492467";
const z3Dig=()=>{const S=10n**207n;let c=1n,sum=0n,k=1n;for(;;){c=c*2n*(2n*BigInt(k)-1n)/BigInt(k);const term=S/(BigInt(k)**3n*c);if(term===0n)break;sum+=(k%2n?1n:-1n)*term;k++}return (5n*sum/2n).toString()};

}
