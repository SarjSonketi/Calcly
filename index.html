<style>

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;user-select:none;overscroll-behavior:none}

button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.ib{width:42px;height:42px;border-radius:12px;background:var(--sf);display:grid;place-items:center}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.disp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 22px 16px;text-align:right;overflow:hidden;word-break:break-all}

.pad button:active{transform:scale(.95);filter:brightness(1.25)}
.pad .o{background:var(--op);color:var(--ac)}
.pad .a{background:var(--ac);color:var(--at)}
.pad .i{width:26px;height:26px;stroke-width:2.4}
.pn{display:none;position:absolute;top:58px;right:12px;width:min(310px,calc(100% - 24px));max-height:70%;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:5}
.pn.o{display:block}
.pn h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pn h3:not(:first-child){margin-top:16px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--key);color:var(--tx);font:inherit;font-size:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--bd)}
.sw button.s{outline:2px solid var(--ac);outline-offset:2px}
.hi{display:block;width:100%;text-align:right;background:var(--key);border-radius:12px;padding:9px 12px;margin-bottom:6px;word-break:break-all}
.hi small{display:block;color:var(--mut);font-size:13px}
.hi b{font-size:19px;font-weight:600}
.em{color:var(--mut);text-align:center;padding:14px 0;font-size:15px}
.cl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;padding:10px;border-radius:12px;background:var(--op);color:var(--tx);font-size:15px}
.cl .i{width:18px;height:18px}
[data-theme=slate]{--bg:#11151a;--sf:#181e26;--key:#202833;--op:#2b3544;--ac:#7aa2c8;--at:#0b1a27;--tx:#e8edf3;--mut:#8794a5;--bd:#252e3a}
[data-theme=teal]{--bg:#0a1517;--sf:#102022;--key:#162b2e;--op:#1f3c40;--ac:#4fb3b0;--at:#04201f;--tx:#e3f3f2;--mut:#78a09e;--bd:#1b3336}
[data-theme=wine]{--bg:#180e12;--sf:#22141a;--key:#2d1b23;--op:#402632;--ac:#d4687f;--at:#2a0714;--tx:#f4e8ec;--mut:#a88892;--bd:#36212b}
[data-theme=mocha]{--bg:#16120f;--sf:#1f1a16;--key:#2a231d;--op:#3b3128;--ac:#c8a26b;--at:#231606;--tx:#f1ebe3;--mut:#9d9184;--bd:#332b24}
.fl{width:26px;height:18px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.lb{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--key);text-align:left;font-size:16px}
.lb span,#ll span{flex:1}
#ll{display:none;max-height:210px;overflow:auto;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:var(--key)}
#ll.o{display:block}

#ll button.s{background:var(--op)}
.pn h2{margin:0 0 12px;font-size:18px}
#tt{position:absolute;left:50%;top:60px;transform:translate(-50%,-8px);max-width:calc(100% - 32px);padding:9px 14px;border-radius:12px;background:var(--ac);color:var(--at);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
#tt.o{opacity:1;transform:translate(-50%,0)}
body,.pad,.pn,.ib,.cl,.hi,.lb,#ll{transition:background-color .3s,color .3s,border-color .3s}
.pad button{transition:transform .08s,filter .1s,background-color .3s,color .3s;animation:ki .35s ease-out backwards}
.ib .i{transition:transform .25s}.ib:active .i{transform:rotate(40deg) scale(.9)}
.sw button{transition:transform .15s}.sw button:active{transform:scale(.85)}
.pn.o,#ll.o{animation:pp .18s ease-out}
.hi{animation:sl .22s ease-out backwards}
.pz{animation:pz .25s ease-out}
.sk{animation:shk .3s}
@keyframes pp{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes ki{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes sl{from{opacity:0;transform:translateX(14px)}}
@keyframes pz{from{opacity:.4;transform:scale(1.08)}}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:16px}
.tg{width:46px;height:26px;border-radius:13px;background:var(--op);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:transform .2s,background .2s}
.tg[aria-checked=true]{background:var(--ac)}
.tg[aria-checked=true]::after{transform:translateX(20px);background:var(--at)}
#mb{margin-top:16px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hd h2{margin:0}
.bb{width:34px;height:34px;border-radius:10px;background:var(--key);display:grid;place-items:center}

.cr{display:flex;gap:10px}.cr label{flex:1;display:flex;align-items:center;gap:6px}
input[type=color]{width:100%;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--key);padding:3px;cursor:pointer}
.sc{display:none}
#app.sci .sc{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 12px 0;background:var(--sf);border-radius:26px 26px 0 0;animation:pp .2s ease-out}
#app.sci .pad{border-radius:0;padding-top:10px}

.sc button{height:clamp(34px,5.4vh,44px);border-radius:12px;background:var(--key);color:var(--ac);font-size:15px;transition:transform .08s,filter .1s}
.sc button:active{transform:scale(.94);filter:brightness(1.25)}
.ic{width:42px;height:42px;border-radius:12px;background:var(--sf);display:grid;place-items:center}
.ic[hidden]{display:none}
.ic:disabled{opacity:.35}.ic:disabled:active{transform:none}
#ab{margin-top:18px}
.mr{display:flex;gap:8px}.mr .ml{flex:1;display:flex;align-items:center}.mr .ic{flex:none;background:var(--key)}
.pn{background:var(--sf);background:color-mix(in srgb,var(--sf) 30%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--bd);border:1px solid color-mix(in srgb,var(--tx) 18%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 color-mix(in srgb,var(--tx) 10%,transparent)}
.pn .hi,.pn .lb,#ll,.pn .bb,.pn .ic,.mr .ml{background:color-mix(in srgb,var(--key) 30%,transparent)}
.pn .cl{background:color-mix(in srgb,var(--op) 30%,transparent)}
.pn .seg button:not(.s){background:color-mix(in srgb,var(--key) 30%,transparent)}
.cw{display:flex;gap:12px;align-items:center}
.lg{width:38px;height:38px;flex:none}
.ap{margin:0 0 4px;line-height:1.5;font-size:15px}
.ml{display:block;padding:12px;border-radius:10px;background:var(--key);color:var(--ac);text-decoration:none;word-break:break-all;font-size:16px;user-select:text;-webkit-user-select:text}
.ic:active{transform:scale(.92)}
.seg{flex-wrap:wrap}.seg button:last-child{flex-basis:100%}
#sgg button,#sgd button{flex-basis:auto!important}

.vr{margin:16px 0 0;text-align:center;color:var(--mut);font-size:13px}
#tb{margin-top:16px}

#v2:not([hidden]),#v3:not([hidden]),#v4:not([hidden]){animation:vin .24s cubic-bezier(.2,.8,.2,1)}

#ll.o{animation:pnin .2s cubic-bezier(.2,.9,.25,1.05);transform-origin:top}

function ev(s){
