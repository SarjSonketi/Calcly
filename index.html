.lk .lgo{width:28px;height:28px;flex:none}
.lk .lt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.lk .lt b{font-size:15px}.lk .lt small{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .ar{width:18px;height:18px;flex:none;color:var(--mut)}
.mr .lk{flex:1}
.vr{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;color:var(--mut);font-size:13px}.vr svg{width:24px;height:24px}
.ucd{padding:12px 14px 14px;border-radius:20px;background:var(--sf);border:1px solid color-mix(in srgb,var(--tx) 8%,transparent);transition:border-color .15s,box-shadow .15s}
.ucd.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.uh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-height:18px}
.ul{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.uz{font-size:11.5px;font-weight:600;color:var(--mut);text-align:right}.uz.bad{color:#ef6b6b}
.ur{display:flex;align-items:center;gap:10px}
.usel{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:58%;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--tx) 8%,transparent);text-align:left}
.usel .sy{color:var(--ac);font-size:20px;min-width:34px}
.usel .un{flex:1;min-width:0;font-size:12.5px;color:var(--mut);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.usel .i{width:16px;height:16px;flex:none;color:var(--mut)}
.uv{flex:1;min-width:0;text-align:right;font-weight:600;word-break:break-all;line-height:1.15;padding:4px 0}.uv.e{color:var(--mut)}
.sw3{display:grid;place-items:center;width:46px;height:46px;margin:-14px auto;position:relative;z-index:2;border-radius:50%;background:var(--ac);color:var(--at);box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .2s}.sw3:active{transform:rotate(180deg) scale(.95)}
.ui{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;background:transparent;text-align:left;font-size:15px}
.ui b{min-width:62px;color:var(--ac)}.ui span{flex:1;min-width:0}

.ulist{display:flex;flex-direction:column;max-height:82%;overflow:hidden}.ulist #ull{overflow:auto;margin:0 -6px}

.bf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.bf .sl{margin:8px 0 6px}.bf .fd{margin:0;font-size:22px;padding:10px;min-height:52px}
.bres{margin-top:14px;padding:16px;border-radius:20px;background:var(--sf);border:1px solid color-mix(in srgb,var(--tx) 8%,transparent)}

.tdg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

function drawPie(g,cx,cy,R0,els,p,col,sty){sty=[0,1,2].includes(sty)?sty:0;

let tpd=null;
const tpfd=()=>{try{return (new Intl.Locale(lang).weekInfo||{}).firstDay||7}catch(e){return 7}};
const tpwl=()=>{try{return new Intl.DateTimeFormat(lang,{weekday:"short"})}catch(e){return{format:d=>["Su","Mo","Tu","We","Th","Fr","Sa"][d.getDay()]}}};
function tpR(){
  const d=tpd.d,y=d.getFullYear(),m=d.getMonth(),fd=tpfd(),pos=x=>(x.getDay()+6)%7;
  let mh;try{mh=new Intl.DateTimeFormat(lang,{month:"long",year:"numeric"}).format(d)}catch(e){mh=(m+1)+"/"+y}
  $("#tdtt").textContent=mh;
  const W=tpwl(),base=new Date(2024,0,1+(fd-1));
  $("#tdw").innerHTML=Array.from({length:7},(_,k)=>"<span>"+W.format(new Date(base.getFullYear(),base.getMonth(),base.getDate()+k))+"</span>").join("");
  const first=new Date(y,m,1),off=(pos(first)+7-(fd-1))%7,days=new Date(y,m+1,0).getDate(),tod=new Date();
  let h="";
  for(let k=0;k<off;k++)h+='<button class="tdy bl" tabindex="-1"></button>';
  for(let dd=1;dd<=days;dd++){
    const isT=tod.getFullYear()==y&&tod.getMonth()==m&&tod.getDate()==dd,isS=d.getDate()==dd;
    h+='<button class="tdy'+(isT?" today":"")+(isS?" sel":"")+'" data-d="'+dd+'">'+dd+"</button>";
  }
  $("#tdg").innerHTML=h;
  $("#tdh2").textContent=tp2(d.getHours());
  $("#tdm2").textContent=tp2(d.getMinutes());
}

function tpStep(sel,f){const d=tpd.d;tpd.d=sel=="h"?new Date(d.getFullYear(),d.getMonth(),d.getDate(),f(d.getHours()),d.getMinutes()):new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),f(d.getMinutes()));tpR()}
